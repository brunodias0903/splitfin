name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  update-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR description from commits
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const messages = commits.map((c) => c.commit.message.split("\n")[0]);
            const firstCommitBody = commits[0]?.commit.message.split("\n").slice(1).filter(Boolean).join("\n") || "";
            const title = messages[0] || "";

            const type = title.split(":")[0] || "";
            const isFeat = type === "feat";
            const isFix = type === "fix";
            const isRefactor = type === "refactor";
            const isStyle = type === "style";
            const isTest = type === "test";
            const isChore = type === "chore";

            const body = [
              "## Descrição",
              "",
              firstCommitBody,
              "",
              "## Tipo de mudança",
              "",
              `- ${isFeat ? "[x]" : "[ ]"} feat: nova funcionalidade`,
              `- ${isFix ? "[x]" : "[ ]"} fix: correção de bug`,
              `- ${isRefactor ? "[x]" : "[ ]"} refactor: refatoração de código`,
              `- ${isStyle ? "[x]" : "[ ]"} style: formatação/styling (sem mudança de lógica)`,
              `- ${isTest ? "[x]" : "[ ]"} test: adição ou alteração de testes`,
              `- ${isChore ? "[x]" : "[ ]"} chore: tarefa de manutenção (build, dependências, config)`,
              "",
              "## Commits",
              "",
              ...commits.map((c) => {
                const [first, ...rest] = c.commit.message.split("\n");
                const body = rest.filter(Boolean).join(" ");
                return body ? `- ${first} — ${body}` : `- ${first}`;
              }),
              "",
              "## Checklist",
              "",
              "- [ ] O código segue o style guide do projeto (Prettier + oxlint)",
              "- [ ] TypeScript compila sem erros (`npm run typecheck`)",
              "- [ ] Testes passam (`npm run test`)",
              "- [ ] Testes novos foram adicionados para cobrir a mudança",
            ].join("\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title,
              body,
            });
