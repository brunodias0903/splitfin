name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  conventions:
    name: Repository conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^(dependabot|renovate)/ ]]; then
            exit 0
          fi

          if [[ ! "$BRANCH_NAME" =~ ^(feat|fix|refactor|perf|test|docs|ci|chore|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected: type/short-kebab-case-description"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://splitfin:splitfin@localhost:5432/splitfin
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm build

  database:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: splitfin_test
          POSTGRES_USER: splitfin
          POSTGRES_PASSWORD: splitfin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitfin -d splitfin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitfin:splitfin@localhost:5432/splitfin_test
      TEST_DATABASE_URL: postgresql://splitfin:splitfin@localhost:5432/splitfin_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:db

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: splitfin
          POSTGRES_USER: splitfin
          POSTGRES_PASSWORD: splitfin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitfin -d splitfin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://splitfin:splitfin@localhost:5432/splitfin
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:4173
      AUTH_SMTP_HOST: localhost
      AUTH_SMTP_PORT: 1025
      AUTH_SMTP_SECURE: false
      AUTH_EMAIL_FROM: Splitfin <no-reply@splitfin.local>
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
