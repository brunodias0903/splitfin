services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: splitfin
      POSTGRES_USER: splitfin
      POSTGRES_PASSWORD: splitfin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitfin -d splitfin"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - splitfin-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  splitfin-postgres-data:
